<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage4 Report</title>
<style>
:root {
  --border: #d7dde8;
  --text: #1f2937;
  --muted: #6b7280;
  --bg: #f5f7fa;
  --panel: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background: var(--bg);
}
header {
  padding: 22px 28px 14px;
  background: #ffffff;
  border-bottom: 1px solid var(--border);
}
h1 { margin: 0 0 8px; font-size: 24px; }
.subtitle { color: var(--muted); font-size: 13px; line-height: 1.5; }
.wrap { max-width: 1186px; margin: 0 auto; padding: 18px 22px 60px; }
.legend, .tools, .switcher, .site-head, .mark-inline {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.legend { margin-bottom: 24px; }
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
.dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-block;
}
.tools { margin: 14px 0; }
button {
  border: 1px solid var(--border);
  background: #ffffff;
  color: #202938;
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 13px;
}
button:hover { background: #f2f5f9; }
.site-btn {
  border-color: transparent;
  color: #ffffff;
  opacity: 0.88;
}
.site-btn.active {
  filter: brightness(1.08) saturate(1.05);
  font-weight: 700;
}
.panel {
  margin-top: 16px;
  padding: 22px 26px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.grid {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr);
  gap: 12px 14px;
  align-items: start;
}
.label { color: var(--muted); font-size: 13px; }
.value { overflow-wrap: anywhere; line-height: 1.45; }
pre {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #f4f6fa;
  overflow: auto;
  white-space: pre-wrap;
  font-size: 12px;
}
.code-box {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #f4f6fa;
  padding: 12px;
}
.code-tools {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.collapsed pre { max-height: 120px; overflow: auto; }
.sample-links { list-style: none; padding: 0; margin: 0; }
.sample-links li { margin-bottom: 6px; }
.sample-links a { color: #1f6feb; text-decoration: none; }
.sample-links a:hover { text-decoration: underline; }
.sample-note { color: var(--muted); font-size: 12px; margin-top: 2px; }
.mark-inline button { padding: 4px 10px; font-size: 12px; }
.mark-inline button.active { font-weight: 700; }
.section-card {
  margin-top: 18px;
  padding: 16px 18px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.section-card h3 {
  margin: 0 0 12px;
  font-size: 16px;
}
.hint { color: var(--muted); font-size: 12px; }
.status-ok { color: #0ba63e; }
.status-fail { color: #e60023; }
.status-warn { color: #ff8a00; }
</style>
</head>
<body>
<header>
  <h1>Stage4 Report</h1>
  <div class="subtitle">Self-contained batch report. All data, CSS, and JS are embedded.</div>
</header>
<div class="wrap">
  <div class="legend">
    <span><i class="dot" style="background:#0ba63e"></i>ok</span>
    <span><i class="dot" style="background:#008af7"></i>partial</span>
    <span><i class="dot" style="background:#ff8a00"></i>none</span>
    <span><i class="dot" style="background:#6b7280"></i>blocked</span>
    <span><i class="dot" style="background:#e60023"></i>dead</span>
    <span><i class="dot" style="background:#7c3aed"></i>amb</span>
  </div>
  <div class="tools">
    <button id="showAll">显示全部</button>
    <button id="failOnly">仅失败</button>
    <button id="exportMarks">导出 marks</button>
    <button id="importMarks">导入 marks</button>
    <button id="copyMarks">复制 marks</button>
    <button id="clearMarks">清空 marks</button>
    <span id="toolHint" style="color:var(--muted);font-size:12px;"></span>
  </div>
  <div id="switcher" class="switcher"></div>
  <div id="panel" class="panel">加载中...</div>
</div>
<script id="report-data-b64" type="text/plain">__REPORT_DATA_B64__</script>
<script>
const DATA = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(document.getElementById('report-data-b64').textContent.trim()), c => c.charCodeAt(0))));
const COLORS = { "ok":"#0ba63e", "partial":"#008af7", "none":"#ff8a00", "blocked":"#6b7280", "dead":"#e60023", "amb":"#7c3aed" };
const REVIEW_STORAGE_KEY = 'v3_site_delivery_manual_review';
const STORE_KEY = "lastSkuManualMarks:v2";
let active = 0;
let failOnly = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function readMarks() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; } }
function saveMarks(v) { localStorage.setItem(STORE_KEY, JSON.stringify(v)); }
function markOf(site) { return readMarks()[site] || ""; }
function copyText(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  const ok = document.execCommand("copy"); document.body.removeChild(ta);
  if (!ok) throw new Error("copy failed"); return true;
}
function siteReviewKey(site) {
  return `${window.location.pathname || 'v3_report'}::${String(site.input_site || '')}`;
}
function loadReviewMap() {
  try {
    const raw = localStorage.getItem(REVIEW_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (err) {
    return {};
  }
}
function saveReviewMap(map) {
  try {
    localStorage.setItem(REVIEW_STORAGE_KEY, JSON.stringify(map));
    return true;
  } catch (err) {
    return false;
  }
}
function getReviewRecord(site) {
  const map = loadReviewMap();
  return map[siteReviewKey(site)] || null;
}
function reviewText(record) {
  if (!record || !record.status) return '';
  const label = record.status === 'success' ? '通过' : record.status === 'failed' ? '拒绝' : '待处理';
  return `${label} ${record.updated_at || ''}`;
}
function reviewBadge(record) {
  if (!record || !record.status) return '<span class="hint">未审核</span>';
  if (record.status === 'success') {
    return `<span class="status-ok">${esc(reviewText(record))}</span>`;
  }
  return `<span class="status-fail">${esc(reviewText(record))}</span>`;
}
function setReviewRecord(site, status) {
  const map = loadReviewMap();
  map[siteReviewKey(site)] = {
    status,
    updated_at: new Date().toLocaleString('zh-CN', { hour12: false })
  };
  const ok = saveReviewMap(map);
  renderSwitcher();
  renderPanel(ok ? '操作成功' : '保存失败');
}
function clearReviewRecord(site) {
  const map = loadReviewMap();
  delete map[siteReviewKey(site)];
  const ok = saveReviewMap(map);
  renderSwitcher();
  renderPanel(ok ? '已重置' : '重置失败');
}
function renderSwitcher() {
  const wrap = document.getElementById("switcher"); wrap.innerHTML = "";
  DATA.forEach((d, i) => {
    if (failOnly && !["blocked","dead","amb","none"].includes(d.coverage)) return;
    const b = document.createElement("button");
    b.className = "site-btn" + (i === active ? " active" : "");
    b.style.background = COLORS[d.coverage] || "#6b7280";
    const record = getReviewRecord(d);
    let suffix = '';
    if (record?.status === 'success') suffix = ' (通过)';
    else if (record?.status === 'failed') suffix = ' (拒绝)';
    const mark = markOf(d.input_site);
    if (mark === 'pass') suffix = ' (通过)';
    else if (mark === 'reject') suffix = ' (拒绝)';
    else if (mark === 'pending') suffix = ' (待处理)';
    b.textContent = (d.index != null ? (d.index + 1) + ' ' : '') + (d.input_site || d.effective_origin || ("site-" + (i + 1))) + suffix;
    b.onclick = () => { active = i; render(); };
    wrap.appendChild(b);
  });
}
function listItems(items) {
  return "<ul>" + (items || []).map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
}
function sampleLinks(items, reasons) {
  return '<ul class="sample-links">' + (items || []).map((u, i) => {
    const url = String(u == null ? "" : u);
    const reason = String((reasons || [])[i] || "");
    const note = reason ? "<div class=\"sample-note\">" + esc(reason) + "</div>" : "";
    return "<li><a href=\"" + esc(url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + esc(url) + "</a>" + note + "</li>";
  }).join("") + "</ul>";
}
function displayCoverage(d) {
  const base = String(d.coverage || '');
  const note = d.coverage_note;
  return base + (note ? ` (${note})` : '');
}
function displayListRuleStatus(value) {
  const text = String(value || '').trim();
  return text === 'validated_completed' ? '已完成' : (text || '未设置');
}
function codeBox(idPrefix, title, codeValue) {
  return `<div class="code-box collapsed" id="${idPrefix}Box"><div class="code-tools"><button id="${idPrefix}Toggle">展开 ${esc(title)}</button><button id="${idPrefix}Copy">复制 ${esc(title)}</button><span id="${idPrefix}Hint" class="hint"></span></div><pre>${esc(codeValue || '')}</pre></div>`;
}
function bindCodeBox(idPrefix, title, codeValue) {
  const toggle = document.getElementById(`${idPrefix}Toggle`);
  if (toggle) {
    toggle.onclick = () => {
      const box = document.getElementById(`${idPrefix}Box`);
      const collapsed = box.classList.toggle("collapsed");
      toggle.textContent = collapsed ? `展开 ${title}` : `收起 ${title}`;
    };
  }
  const copy = document.getElementById(`${idPrefix}Copy`);
  if (copy) {
    copy.onclick = async () => {
      try {
        await copyText(codeValue || "");
        document.getElementById(`${idPrefix}Hint`).textContent = "已复制";
      } catch (err) {
        document.getElementById(`${idPrefix}Hint`).textContent = "复制失败";
      }
    };
  }
}
function markInline(d) {
  const status = markOf(d.input_site);
  return "<div class=\"mark-inline\">" +
    "<span style=\"color:var(--muted);font-size:12px;\">人工标记:</span>" +
    "<button data-mark=\"pending\" class=\"" + (status === "pending" ? "active" : "") + "\">待处理</button>" +
    "<button data-mark=\"pass\" class=\"" + (status === "pass" ? "active" : "") + "\">通过</button>" +
    "<button data-mark=\"reject\" class=\"" + (status === "reject" ? "active" : "") + "\">拒绝</button>" +
    "<button data-mark=\"reset\">重置</button>" +
    "</div>";
}
function renderPanel(message) {
  const d = DATA[active];
  if (!d) {
    document.getElementById("panel").innerHTML = '<div class="hint">无数据</div>';
    return;
  }
  const isListCode = d.companion && d.companion.type === "list_custom_code";
  const reviewRecord = getReviewRecord(d);
  const embeddedStatus = d.embedded_status || '';
  let embeddedBadge;
  if (embeddedStatus === 'checker_passed') {
    embeddedBadge = '<span class="status-ok">checker_passed</span>';
  } else if (embeddedStatus === 'generated_not_verified') {
    embeddedBadge = '<span class="status-warn">generated_not_verified</span>';
  } else {
    embeddedBadge = esc(embeddedStatus || '');
  }
  const finalCodeBlock = d.final_code_value
    ? codeBox("finalCode", "final_code.py", d.final_code_value)
    : '<div class="hint">无 final_code.py 数据</div>';
  const companion = isListCode
    ? codeBox("listCode", "list_custom_code", (d.companion && d.companion.value) || '')
    : '<div class="value">' + esc((d.companion && d.companion.value) || '') + '</div>';
  document.getElementById("panel").innerHTML =
    '<div class="site-head"><h2>' + esc(d.input_site || '') + '</h2>' + markInline(d) + '</div>' +
    '<div class="grid">' +
    '<div class="label">origin</div><div class="value">' + esc(d.effective_origin || '') + (d.commerce_origin ? ' / ' + esc(d.commerce_origin) : '') + '</div>' +
    '<div class="label">scope_reason</div><div class="value">' + esc(d.scope_reason || '') + '</div>' +
    '<div class="label">coverage</div><div class="value">' + esc(displayCoverage(d)) + '</div>' +
    '<div class="label">observed_count</div><div class="value">' + Number(d.observed_count || 0) + '</div>' +
    '</div>' +
    '<section class="section-card"><h3>人工审核</h3>' +
    '<div class="manual-review">' +
    '<span class="review-label">状态:</span>' +
    '<span class="review-state">' + reviewBadge(reviewRecord) + '</span>' +
    '<button id="manualReviewSuccess">标记通过</button>' +
    '<button id="manualReviewFailed">标记拒绝</button>' +
    '<button id="manualReviewClear">重置</button>' +
    '<span class="hint">' + esc(message || '点击按钮标记当前站点的审核状态，数据保存在 localStorage 中') + '</span>' +
    '</div>' +
    '</section>' +
    '<section class="section-card"><h3>Stage3 提取</h3>' +
    '<div class="grid">' +
    '<div class="label">final_code_compile</div><div class="value">' + (d.final_code_compiles ? '通过' : '未知') + '</div>' +
    '<div class="label">rendered_html</div><div class="value">' + (d.rendered_html_exists ? '存在' : '未知') + '</div>' +
    '</div>' +
    finalCodeBlock +
    '</section>' +
    '<section class="section-card"><h3>列表发现</h3>' +
    '<div class="grid">' +
    '<div class="label">list_rule_status</div><div class="value">' + esc(displayListRuleStatus(d.list_rule_status)) + '</div>' +
    '<div class="label">sitemap</div><div class="value">' + esc(d.sitemap || '') + '</div>' +
    '<div class="label">' + esc((d.companion && d.companion.type) || 'companion') + '</div>' + companion +
    '</div>' +
    '</section>' +
    '<section class="section-card"><h3>样本 PDP</h3>' + sampleLinks(d.sample_detail_uris || d.sample_detail_urls, d.sample_detail_reasons) + '</section>' +
    '<section class="section-card"><h3>process_notes</h3>' + listItems(d.process_notes) + '</section>' +
    '<section class="section-card"><h3>risks</h3>' + listItems(d.risks || d.notes) + '</section>';
  document.querySelectorAll("[data-mark]").forEach(btn => {
    btn.onclick = () => {
      const val = btn.getAttribute("data-mark");
      const all = readMarks();
      if (val === "reset") delete all[d.input_site]; else all[d.input_site] = val;
      saveMarks(all); render();
    };
  });
  bindCodeBox("listCode", "list_custom_code", (d.companion && d.companion.value) || '');
  if (d.final_code_value) {
    bindCodeBox("finalCode", "final_code.py", d.final_code_value);
  }
  const successBtn = document.getElementById('manualReviewSuccess');
  if (successBtn) successBtn.onclick = () => setReviewRecord(d, 'success');
  const failedBtn = document.getElementById('manualReviewFailed');
  if (failedBtn) failedBtn.onclick = () => setReviewRecord(d, 'failed');
  const clearBtn = document.getElementById('manualReviewClear');
  if (clearBtn) clearBtn.onclick = () => clearReviewRecord(d);
}
function render() { renderSwitcher(); renderPanel(); }
document.getElementById("showAll").onclick = () => { failOnly = false; render(); };
document.getElementById("failOnly").onclick = () => { failOnly = true; render(); };
document.getElementById("exportMarks").onclick = async () => {
  try { await copyText(JSON.stringify(readMarks(), null, 2)); document.getElementById("toolHint").textContent = "已复制 marks JSON"; }
  catch (e) { document.getElementById("toolHint").textContent = "导出失败"; }
};
document.getElementById("importMarks").onclick = () => {
  const input = prompt("粘贴 marks JSON:");
  if (input) {
    try {
      const data = JSON.parse(input);
      saveMarks(data);
      render();
      document.getElementById("toolHint").textContent = "导入成功";
    } catch (e) {
      document.getElementById("toolHint").textContent = "导入失败: JSON 格式错误";
    }
  }
};
document.getElementById("copyMarks").onclick = async () => {
  try { await copyText(JSON.stringify(readMarks())); document.getElementById("toolHint").textContent = "已复制 marks"; }
  catch (e) { document.getElementById("toolHint").textContent = "复制失败"; }
};
document.getElementById("clearMarks").onclick = () => {
  if (confirm("确认清空所有人工标记?")) { localStorage.removeItem(STORE_KEY); render(); }
};
render();
</script>
</body>
</html>
