[project]
name = "codex-agent-product-info-template-pro"
version = "0.1.0"
description = "Codex agent product info extraction template"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "openpyxl",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "PyYAML>=6.0",
    "playwright",
    "beautifulsoup4",
    "lxml",
    "tiktoken",
    "requests",
    "curl_cffi",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
